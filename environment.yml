name: proxygap-ant
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # CPU PyTorch is sufficient; no CUDA runtime is required.
      - torch==2.13.0
      - gymnasium[mujoco]==1.3.0
      - stable-baselines3==2.9.0
      - mujoco==3.11.0
      - numpy==2.4.6
      - pandas==3.0.5
      - matplotlib==3.11.1
      - pillow
      - av==16.0.1
      - pytest==9.1.1
